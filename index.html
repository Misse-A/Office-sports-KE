<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Office Tournament Tracker</title>
<style>
    :root { 
        --primary: #3643ba; 
        --bg-light: #f8fafc; 
        --border: #cbd5e1;
        --text-dark: #1e293b;
    }
    
    body { 
        margin: 0;
        font-family: 'Helvetica Neue', Arial, sans-serif; 
        background-color: var(--bg-light); 
        color: var(--text-dark);
    }

    /* Split Screen Layout */
    .layout-wrapper {
        display: flex;
        min-height: 100vh;
        width: 100%;
    }

    .brand-side {
        background-color: var(--primary);
        width: 50%;
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    .brand-logo { max-width: 250px; margin-bottom: 40px; z-index: 2; }
    .brand-text { font-size: 2.2rem; line-height: 1.3; font-weight: 300; max-width: 400px; z-index: 2; }
    .brand-text strong { font-weight: 700; }

    .form-side {
        width: 50%;
        background-color: white;
        padding: 40px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        overflow-y: auto;
    }

    .form-container { width: 100%; max-width: 450px; margin-top: 4vh; }
    .mobile-logo { display: none; }

    .form-title { font-size: 1.8rem; font-weight: bold; margin-bottom: 30px; color: var(--text-dark); }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 500; margin-bottom: 8px; font-size: 14px; color: #475569; }

    select, input[type="number"], input[type="file"] { 
        width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 4px; box-sizing: border-box; font-size: 15px; background-color: var(--bg-light); transition: border-color 0.2s;
    }
    select:focus, input[type="number"]:focus { outline: none; border-color: var(--primary); }

    .match-setup { display: grid; grid-template-columns: 1fr auto 1fr; gap: 15px; align-items: center; background: var(--bg-light); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border); }
    .vs-badge { font-weight: bold; color: var(--primary); font-size: 1.2rem; }
    
    .btn-primary { background-color: var(--primary); color: white; border: none; padding: 14px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px; transition: background-color 0.2s; }
    .btn-secondary { background-color: white; color: var(--primary); border: 1px solid var(--primary); padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; width: auto; margin-bottom: 10px; font-weight: bold; }
    .btn-primary:hover { background-color: #2a3492; }
    .btn-secondary:hover { background-color: #f1f5f9; }
    
    .hidden { display: none !important; }
    .error { color: #ef4444; font-size: 12px; margin-top: 5px; display: block; }
    .spacer { margin-top: 10px; }

    /* Mobile Responsiveness */
    @media (max-width: 900px) {
        .layout-wrapper { flex-direction: column; }
        .form-side { width: 100%; padding: 30px 20px; order: 1; }
        .brand-side { width: 100%; padding: 40px 20px; min-height: 300px; order: 2; }
        .brand-text { font-size: 1.8rem; }
        .form-container { margin-top: 0; }
        .brand-logo { display: none; }
        .mobile-logo { display: block; max-width: 200px; margin: 0 0 30px 0; }
    }
</style>
</head>
<body>

<div class="layout-wrapper">
    <div class="brand-side">
        <img src="https://contents.mediadecathlon.com/b101216/k$8846f6a168e79c85734dad3defd320ac/defaut.svg?format=auto" alt="Logo" class="brand-logo">
        <div class="brand-text">Bring people <strong>together</strong> through sport to make <em>wellbeing</em> accessible for <strong>all</strong></div>
    </div>

    <div class="form-side">
        <div class="form-container">
            <img src="https://contents.mediadecathlon.com/b101212/k$a94f45fac8993f18e72bbb5fff402b9d/defaut.svg?format=auto" alt="Decathlon Logo" class="mobile-logo">
            <h2 class="form-title">Record Match Data</h2>
            
            <form id="tournamentForm">
                <div class="form-group">
                    <label>Sport</label>
                    <select id="sport" required>
                        <option value="">Select a Sport...</option>
                        <option value="Pickleball">Pickleball</option>
                        <option value="Padel">Padel</option>
                        <option value="Running">Running</option>
                        <option value="Cycling">Cycling</option>
                        <option value="Rugby">Rugby</option>
                        <option value="Ballet">Ballet</option>
                        <option value="Tennis">Tennis</option>
                        <option value="Badminton">Badminton</option>
                        <option value="Hiking">Hiking</option>
                        <option value="Weight Lifting">Weight Lifting</option>
                        <option value="Football">Football</option>
                        <option value="Yoga">Yoga</option>
                        <option value="Boxing">Boxing</option>
                    </select>
                </div>

                <div class="form-group hidden" id="typeGroup">
                    <label>Type</label>
                    <select id="matchType" required></select>
                </div>

                <div class="form-group hidden" id="distanceGroup">
                    <label>Distance (KM)</label>
                    <input type="number" id="distance" step="0.1" min="5">
                    <span class="error hidden" id="distanceError">Distance must be at least 5km.</span>
                </div>

                <div class="match-setup hidden" id="competitiveLayout">
                    <div>
                        <label>Team 1</label>
                        <select class="player-select comp-select" id="p1"></select>
                        <div class="spacer"></div>
                        <select class="player-select comp-select hidden" id="p2"></select>
                        <label class="spacer">Score</label>
                        <input type="number" id="score1" min="0">
                    </div>
                    <div class="vs-badge">VS</div>
                    <div>
                        <label>Team 2</label>
                        <select class="player-select comp-select" id="p3"></select>
                        <div class="spacer"></div>
                        <select class="player-select comp-select hidden" id="p4"></select>
                        <label class="spacer">Score</label>
                        <input type="number" id="score2" min="0">
                    </div>
                </div>

                <div class="form-group hidden" id="groupLayout">
                    <label>Participants</label>
                    <div id="dynamicPlayerContainer"></div>
                    <button type="button" class="btn-secondary hidden" id="addPlayerBtn">+ Add Player</button>
                </div>

                <div class="form-group">
                    <label>Picture 1 (JPG/PNG)</label>
                    <input type="file" id="pic1" accept=".jpg, .jpeg, .png">
                </div>
                <div class="form-group">
                    <label>Picture 2 (JPG/PNG)</label>
                    <input type="file" id="pic2" accept=".jpg, .jpeg, .png">
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">Submit Data</button>
            </form>
        </div>
    </div>
</div>

<script>
    // --- GOOGLE APPS SCRIPT URL ---
    // PASTE THE URL YOU COPIED FROM STEP 3 HERE:
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbycUTwjQKYDRlVENfEK3J8KbSZIxw3wUpniRoMzlp8Tz6QJAT8XuzBCchgI-jQpUdMGzg/exec"; 

    const players = ["Michael", "Samson", "Martha", "Adele"];
    const sportEl = document.getElementById('sport');
    const typeEl = document.getElementById('matchType');
    let groupPlayerCount = 0;
    
    function populateSelect(selectEl) {
        selectEl.innerHTML = '<option value="">Select Player...</option>';
        players.forEach(p => selectEl.innerHTML += `<option value="${p}">${p}</option>`);
        selectEl.addEventListener('change', updatePlayerOptions);
    }

    document.querySelectorAll('.comp-select').forEach(populateSelect);

    function addGroupPlayer() {
        groupPlayerCount++;
        const select = document.createElement('select');
        select.className = 'player-select group-select';
        select.id = `g${groupPlayerCount}`;
        select.style.marginBottom = '10px';
        populateSelect(select);
        document.getElementById('dynamicPlayerContainer').appendChild(select);
        updatePlayerOptions();
    }

    document.getElementById('addPlayerBtn').addEventListener('click', addGroupPlayer);

    function updatePlayerOptions() {
        const allSelects = Array.from(document.querySelectorAll('.player-select'));
        const selectedValues = allSelects.map(s => s.value).filter(v => v);
        
        allSelects.forEach(select => {
            Array.from(select.options).forEach(opt => {
                opt.disabled = opt.value && selectedValues.includes(opt.value) && select.value !== opt.value;
            });
        });
    }

    function updateUI() {
        const sport = sportEl.value;
        document.getElementById('typeGroup').classList.remove('hidden');
        if (!sport) return document.getElementById('typeGroup').classList.add('hidden');

        if (sport === 'Pickleball') typeEl.innerHTML = '<option value="Singles">Singles</option><option value="Doubles">Doubles</option>';
        else if (sport === 'Padel') typeEl.innerHTML = '<option value="Doubles">Doubles</option>';
        else typeEl.innerHTML = '<option value="Individual">Individual</option><option value="Group">Group</option>';
        
        handleTypeChange();
    }

    function handleTypeChange() {
        const sport = sportEl.value;
        const type = typeEl.value;
        const compLayout = document.getElementById('competitiveLayout');
        const groupLayout = document.getElementById('groupLayout');
        const distGroup = document.getElementById('distanceGroup');
        const addBtn = document.getElementById('addPlayerBtn');

        compLayout.classList.add('hidden');
        groupLayout.classList.add('hidden');
        distGroup.classList.add('hidden');
        document.getElementById('dynamicPlayerContainer').innerHTML = '';
        groupPlayerCount = 0;

        if (sport === 'Running' || sport === 'Cycling') distGroup.classList.remove('hidden');

        if (sport === 'Pickleball' || sport === 'Padel') {
            compLayout.classList.remove('hidden');
            document.getElementById('p2').classList.toggle('hidden', type === 'Singles');
            document.getElementById('p4').classList.toggle('hidden', type === 'Singles');
            document.getElementById('score1').required = true;
            document.getElementById('score2').required = true;
            addBtn.classList.add('hidden'); 
        } else {
            groupLayout.classList.remove('hidden');
            document.getElementById('score1').required = false;
            document.getElementById('score2').required = false;
            let initialInputs = type === 'Individual' ? 1 : 3;
            for(let i=0; i<initialInputs; i++) addGroupPlayer();
            if (type === 'Group') addBtn.classList.remove('hidden');
            else addBtn.classList.add('hidden');
        }
        
        document.querySelectorAll('.player-select').forEach(s => s.value = '');
        updatePlayerOptions();
    }

    sportEl.addEventListener('change', updateUI);
    typeEl.addEventListener('change', handleTypeChange);

    // Helper Function to convert Image to Base64 String
    function getBase64(file) {
        return new Promise((resolve, reject) => {
            if (!file) return resolve("");
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    document.getElementById('tournamentForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const sport = sportEl.value;
        const type = typeEl.value;
        const distance = document.getElementById('distance').value;
        const submitBtn = document.getElementById('submitBtn');

        if ((sport === 'Running' || sport === 'Cycling') && distance < 5) {
            document.getElementById('distanceError').classList.remove('hidden');
            return;
        }

        submitBtn.innerText = "Uploading to Drive & Sheets...";
        submitBtn.disabled = true;

        const now = new Date();
        const formattedDate = now.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) + ' ' + now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

        // Build Payload Object (Instead of FormData)
        let payload = {
            Date: formattedDate,
            RecordedBy: "user@office.com", 
            Sport: sport,
            Type: type,
            DistanceKM: distance || "",
            Player1: "", Player2: "", Player3: "", Player4: "",
            ScoreTeam1: "", ScoreTeam2: ""
        };

        let pointsData = {};
        let additionalPlayers = [];

        if (sport === 'Pickleball' || sport === 'Padel') {
            const s1 = parseInt(document.getElementById('score1').value);
            const s2 = parseInt(document.getElementById('score2').value);
            payload.ScoreTeam1 = s1;
            payload.ScoreTeam2 = s2;
            
            payload.Player1 = document.getElementById('p1').value;
            payload.Player3 = document.getElementById('p3').value;
            
            let w = type === 'Doubles' ? 6 : 3;
            let l = type === 'Doubles' ? 2 : 1;
            let p1Pts = s1 > s2 ? w : (s1 < s2 ? l : 0);
            let p2Pts = s2 > s1 ? w : (s2 < s1 ? l : 0);

            if(payload.Player1) pointsData[payload.Player1] = p1Pts;
            if(payload.Player3) pointsData[payload.Player3] = p2Pts;
            
            if (type === 'Doubles') {
                payload.Player2 = document.getElementById('p2').value;
                payload.Player4 = document.getElementById('p4').value;
                if(payload.Player2) pointsData[payload.Player2] = p1Pts;
                if(payload.Player4) pointsData[payload.Player4] = p2Pts;
            }
        } else {
            let pts = (sport === 'Running' || sport === 'Cycling') ? (type === 'Individual' ? 2 : 4) : (type === 'Individual' ? 2 : 3);
            
            const groupSelects = Array.from(document.querySelectorAll('.group-select')).filter(s => s.value);
            groupSelects.forEach((select, index) => {
                pointsData[select.value] = pts;
                if (index === 0) payload.Player1 = select.value;
                else if (index === 1) payload.Player2 = select.value;
                else if (index === 2) payload.Player3 = select.value;
                else if (index === 3) payload.Player4 = select.value;
                else additionalPlayers.push(select.value);
            });
        }

        payload.AdditionalPlayers = additionalPlayers.join(", ");
        payload.PointsDistributed = Object.entries(pointsData).map(([name, pts]) => `${name}: ${pts}`).join(" | ");

        // Convert Images to Base64
        const pic1File = document.getElementById('pic1').files[0];
        const pic2File = document.getElementById('pic2').files[0];
        
        payload.picture1Base64 = await getBase64(pic1File);
        payload.picture2Base64 = await getBase64(pic2File);

        // Send to Google Apps Script
        try {
            // Using text/plain to avoid strict CORS preflight issues with GAS
            const response = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                body: JSON.stringify(payload)
            });
            
            const result = await response.json();
            
            if(result.status === "success") {
                alert('Success! Data saved to Google Sheets and Images uploaded to Drive.');
                document.getElementById('tournamentForm').reset();
                updateUI(); 
            } else {
                throw new Error(result.message || "Unknown server error");
            }
        } catch (error) {
            alert('Error submitting data. Check your App Script logs.');
            console.error(error);
        }

        submitBtn.innerText = "Submit Data";
        submitBtn.disabled = false;
    });
</script>
</body>
</html>
